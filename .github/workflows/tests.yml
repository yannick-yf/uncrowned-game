name: tests

# The gate on main. A pull request that cannot go green does not get merged.
#
# The suite is the same one run locally — tools/run_tests.sh is the sanctioned
# entry point because the runner cannot see its own stderr, so a test that
# crashes after its first assertion would otherwise report "ok".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when the branch gets a new push. Two runs of the same
# PR tell you nothing the later one does not.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Keep this in step with the version in project.godot.
      GODOT_VERSION: "4.7.2"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-stable"

          # Resolve the asset from the release rather than guessing the filename:
          # Godot's linux asset naming has changed between minor versions before.
          URL=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/godotengine/godot/releases/tags/${TAG}" \
                | grep -o 'https://[^"]*linux[._]x86_64\.zip' \
                | grep -v mono | head -n1)

          if [ -z "${URL}" ]; then
            echo "Could not find a linux x86_64 asset for ${TAG}." >&2
            exit 1
          fi
          echo "Using ${URL}"

          curl -sfL -o godot.zip "${URL}"
          unzip -q godot.zip
          BIN=$(find . -maxdepth 1 -type f -name 'Godot_v*' | head -n1)
          mv "${BIN}" godot-bin
          chmod +x godot-bin
          ./godot-bin --version

      # His scenes, copied into the project with their paths repointed
      # (docs/MIGRATION_3D.md §6, M2b). Generated here and never committed, so the
      # import below sees them.
      - name: Vendor the Brindle 3D workshop
        run: ./godot-bin --headless --path . -s tools/vendor_workshop.gd

      - name: Import assets
        run: ./godot-bin --headless --path . --import

      # The game's world: the one baked from the 3D workshop (M4, 2026-09-13).
      - name: Run the whole suite
        env:
          GODOT: ./godot-bin
        run: |
          chmod +x tools/run_tests.sh
          tools/run_tests.sh --all

      # And the 2D map v1 and v2 were built on, which keeps its tests: the kit's
      # shape and the thesis are proved there tile for tile.
      - name: Run the whole suite on the 2D map
        env:
          GODOT: ./godot-bin
        run: tools/run_tests.sh --procedural --all

      # The art workshop has its own project.godot and resource root. The
      # production importer ignores prototypes/, so it needs a separate check.
      - name: Import and check the Brindle 3D workshop
        env:
          GODOT: ./godot-bin
        run: bash prototypes/brindle_3d/tools/check_workshop.sh

      # The contract between his map and our content (docs/MIGRATION_3D.md §6.2):
      # the checked-in bake must be the bake of the data in this commit, and the
      # same suite must be green on the baked world. A DEBT line is the map's to
      # settle and does not fail the run; a FAIL is ours.
      - name: The baked world is current
        run: ./godot-bin --headless --path . -s tools/bake_region.gd -- --check
